<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Marketing Portfolio</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #fff;
      color: #111;
    }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; }

    .portfolio-header {
      width: 100%;
      padding: 90px 24px 60px;
      text-align: center;
    }
    .portfolio-header .eyebrow {
      margin-bottom: 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      color: #9b9b9b;
    }
    .portfolio-header h1 {
      margin-bottom: 25px;
      font-size: clamp(45px, 6vw, 76px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -3px;
    }
    .portfolio-header p {
      font-size: 14px;
      line-height: 1.8;
      color: #777;
    }

    .filter-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }
    .filters {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .7px;
      cursor: pointer;
      transition: color .25s ease;
    }
    .filter-btn:hover,
    .filter-btn.active { color: #111; }
    .filter-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -9px;
      width: 100%;
      height: 2px;
      background: #111;
    }

    .portfolio-section {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 70px 28px 120px;
    }
    .portfolio-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 50px 28px;
    }
    .portfolio-item {
      width: 100%;
      min-width: 0;
      cursor: pointer;
    }
    .portfolio-item.hide { display: none; }

    .portfolio-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #fafafa;
    }
    .portfolio-thumb img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transition: opacity .25s ease, transform .55s cubic-bezier(.2,.7,.2,1);
    }
    .portfolio-thumb img.loaded { opacity: 1; }
    .portfolio-item:hover .portfolio-thumb img.loaded { transform: scale(1.025); }

    .placeholder {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f5f5f5;
      color: #aaa;
      font-size: 12px;
      line-height: 1.7;
    }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.58);
      color: #fff;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .portfolio-item:hover .portfolio-overlay { opacity: 1; }
    .portfolio-overlay .category {
      margin-bottom: 11px;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: .75;
    }
    .portfolio-overlay h3 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -.4px;
    }

    .portfolio-info { padding-top: 17px; }
    .portfolio-info .category {
      margin-bottom: 7px;
      color: #a0a0a0;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
    .portfolio-info h3 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -.5px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      overflow-y: auto;
      padding: 75px 25px 80px;
      background: rgba(0,0,0,.93);
    }
    .modal.show { display: block; }
    .modal-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .modal-close {
      position: fixed;
      top: 25px;
      right: 30px;
      z-index: 10000;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 27px;
      line-height: 48px;
      cursor: pointer;
      transition: background .2s ease;
    }
    .modal-close:hover { background: rgba(255,255,255,.25); }
    .modal-title {
      margin-bottom: 40px;
      text-align: center;
      color: #fff;
    }
    .modal-title .category {
      margin-bottom: 10px;
      color: #aaa;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .modal-title h2 { font-size: 27px; font-weight: 500; }
    .modal-images {
      display: flex;
      flex-direction: column;
      gap: 55px;
    }
    .modal-image-section { width: 100%; }
    .modal-label {
      margin-bottom: 12px;
      text-align: center;
      color: #ccc;
      font-size: 10px;
      letter-spacing: 2px;
    }
    .modal-image-block {
      width: 100%;
      padding: 12px;
      background: #fff;
    }
    .modal-image-block img {
      width: 100%;
      height: auto;
      margin: auto;
    }
    .modal-image-section.mobile {
      max-width: 600px;
      margin: 0 auto;
    }

    footer {
      padding: 50px 20px;
      border-top: 1px solid #eee;
      text-align: center;
      color: #999;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 1000px) {
      .portfolio-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 650px) {
      .portfolio-header { padding: 65px 20px 45px; }
      .portfolio-header h1 { letter-spacing: -2px; }
      .filters {
        justify-content: flex-start;
        gap: 26px;
        padding: 20px 16px;
      }
      .portfolio-section { padding: 50px 16px 80px; }
      .portfolio-grid { grid-template-columns: 1fr; gap: 42px; }
      .portfolio-overlay { display: none; }
      .modal { padding: 70px 10px 40px; }
      .modal-close { top: 14px; right: 14px; }
    }
  </style>
</head>

<body>
  <header class="portfolio-header">
    <div class="eyebrow">HOSPITAL MARKETING</div>
    <h1>PORTFOLIO</h1>
    <p>병원 브랜드의 특성과 목적에 맞춰<br>제작한 콘텐츠 디자인 작업물입니다.</p>
  </header>

  <nav class="filter-wrap">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="blog">BLOG SKIN</button>
      <button class="filter-btn" data-filter="event">EVENT</button>
      <button class="filter-btn" data-filter="posting">POSTING</button>
      <button class="filter-btn" data-filter="holiday">HOLIDAY</button>
    </div>
  </nav>

  <main class="portfolio-section">
    <div class="portfolio-grid" id="portfolioGrid"></div>
  </main>

  <div class="modal" id="portfolioModal">
    <button class="modal-close" id="modalClose" type="button">×</button>

    <div class="modal-inner">
      <div class="modal-title">
        <div class="category" id="modalCategory"></div>
        <h2 id="modalTitle"></h2>
      </div>

      <div class="modal-images" id="modalImages"></div>
    </div>
  </div>

  <footer>© 2026 Hospital Marketing Portfolio</footer>

  <script>
    const pad2 = n => String(n).padStart(2, "0");

    const portfolioData = [
      ...Array.from({ length: 10 }, (_, i) => {
        const no = pad2(i + 1);
        return {
          category: "blog",
          title: `Blog Skin Design ${no}`,
          main: `images/blog/blog${no}_pc.png`,
          sub: `images/blog/blog${no}_mobile.png`
        };
      }),

      ...Array.from({ length: 19 }, (_, i) => {
        const no = pad2(i + 1);
        return {
          category: "event",
          title: `Event Design ${no}`,
          main: `images/event/event${no}.png`
        };
      }),

      ...Array.from({ length: 30 }, (_, i) => {
        const no = pad2(i + 1);
        return {
          category: "posting",
          title: `Posting Design ${no}`,
          main: `images/posting/posting${no}.png`
        };
      }),

      ...Array.from({ length: 22 }, (_, i) => {
        const no = pad2(i + 1);
        return {
          category: "holiday",
          title: `Holiday Design ${no}`,
          main: `images/holiday/holiday${no}.png`
        };
      })
    ];

    const categoryNames = {
      blog: "BLOG SKIN",
      event: "EVENT",
      posting: "POSTING",
      holiday: "HOLIDAY"
    };

    const portfolioGrid = document.getElementById("portfolioGrid");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const modal = document.getElementById("portfolioModal");
    const modalClose = document.getElementById("modalClose");
    const modalCategory = document.getElementById("modalCategory");
    const modalTitle = document.getElementById("modalTitle");
    const modalImages = document.getElementById("modalImages");

    function createPortfolioItems() {
      portfolioGrid.innerHTML = "";

      portfolioData.forEach((item, index) => {
        const article = document.createElement("article");
        article.className = "portfolio-item";
        article.dataset.category = item.category;
        article.dataset.index = index;

        const thumb = document.createElement("div");
        thumb.className = "portfolio-thumb";

        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.innerHTML = `${categoryNames[item.category]}<br>이미지를 불러오는 중입니다.`;

        const image = document.createElement("img");
        image.alt = item.title;
        image.loading = "lazy";
        image.decoding = "async";

        image.onload = () => {
          image.classList.add("loaded");
          if (placeholder.isConnected) placeholder.remove();
        };

        image.onerror = () => {
          image.remove();
          placeholder.innerHTML = `${categoryNames[item.category]}<br>이미지 파일을 확인해주세요.`;
        };

        image.src = item.main;

        if (image.complete && image.naturalWidth > 0) {
          image.classList.add("loaded");
          if (placeholder.isConnected) placeholder.remove();
        }

        const overlay = document.createElement("div");
        overlay.className = "portfolio-overlay";
        overlay.innerHTML = `
          <div class="category">${categoryNames[item.category]}</div>
          <h3>${item.title}</h3>
        `;

        thumb.appendChild(placeholder);
        thumb.appendChild(image);
        thumb.appendChild(overlay);

        const info = document.createElement("div");
        info.className = "portfolio-info";
        info.innerHTML = `
          <div class="category">${categoryNames[item.category]}</div>
          <h3>${item.title}</h3>
        `;

        article.appendChild(thumb);
        article.appendChild(info);
        article.addEventListener("click", () => openModal(item));
        portfolioGrid.appendChild(article);
      });
    }

    function getPortfolioItems() {
      return document.querySelectorAll(".portfolio-item");
    }

    function showAllPreview() {
      getPortfolioItems().forEach(item => item.classList.remove("hide"));
    }

    function showCategory(category) {
      getPortfolioItems().forEach(item => {
        item.classList.toggle("hide", item.dataset.category !== category);
      });
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        filterButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");

        const filter = button.dataset.filter;
        filter === "all" ? showAllPreview() : showCategory(filter);
      });
    });

    function openModal(item) {
      modalCategory.textContent = categoryNames[item.category];
      modalTitle.textContent = item.title;
      modalImages.innerHTML = "";

      if (item.main) {
        const mainSection = document.createElement("div");
        mainSection.className = "modal-image-section";

        const mainLabel = document.createElement("div");
        mainLabel.className = "modal-label";
        mainLabel.textContent = item.category === "blog" ? "PC VERSION" : "DESIGN";

        const mainBox = document.createElement("div");
        mainBox.className = "modal-image-block";

        const mainImage = document.createElement("img");
        mainImage.src = item.main;
        mainImage.alt = item.title;

        mainBox.appendChild(mainImage);
        mainSection.appendChild(mainLabel);
        mainSection.appendChild(mainBox);
        modalImages.appendChild(mainSection);
      }

      if (item.sub) {
        const mobileSection = document.createElement("div");
        mobileSection.className = "modal-image-section mobile";

        const mobileLabel = document.createElement("div");
        mobileLabel.className = "modal-label";
        mobileLabel.textContent = "MOBILE VERSION";

        const mobileBox = document.createElement("div");
        mobileBox.className = "modal-image-block";

        const mobileImage = document.createElement("img");
        mobileImage.src = item.sub;
        mobileImage.alt = item.title;

        mobileBox.appendChild(mobileImage);
        mobileSection.appendChild(mobileLabel);
        mobileSection.appendChild(mobileBox);
        modalImages.appendChild(mobileSection);
      }

      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("show");
      document.body.style.overflow = "";
    }

    modalClose.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    createPortfolioItems();
    showAllPreview();
  </script>
</body>
</html>
