<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hospital Marketing Portfolio</title>


  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: #ffffff;
      color: #111111;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button {
      font-family: inherit;
    }



    /* =========================================
       HEADER
    ========================================= */

    .portfolio-header {
      width: 100%;

      padding:
        90px
        24px
        60px;

      text-align: center;
    }

    .portfolio-header .eyebrow {
      margin-bottom: 16px;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 4px;

      color: #9b9b9b;
    }

    .portfolio-header h1 {
      margin-bottom: 25px;

      font-size:
        clamp(
          45px,
          6vw,
          76px
        );

      font-weight: 700;
      line-height: 1;
      letter-spacing: -3px;
    }

    .portfolio-header p {
      font-size: 14px;

      line-height: 1.8;

      color: #777777;
    }



    /* =========================================
       FILTER
    ========================================= */

    .filter-wrap {
      position: sticky;

      top: 0;

      z-index: 100;

      width: 100%;

      background:
        rgba(
          255,
          255,
          255,
          0.96
        );

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      border-top:
        1px solid #eeeeee;

      border-bottom:
        1px solid #eeeeee;
    }

    .filters {
      width: 100%;

      max-width: 1400px;

      margin:
        0
        auto;

      padding:
        22px
        28px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 38px;

      white-space: nowrap;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      appearance: none;
      -webkit-appearance: none;

      position: relative;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      background: transparent;

      color: #aaaaaa;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 0.7px;

      cursor: pointer;

      transition:
        color
        0.25s ease;
    }

    .filter-btn:hover {
      color: #111111;
    }

    .filter-btn.active {
      color: #111111;
    }

    .filter-btn.active::after {
      content: "";

      position: absolute;

      left: 0;

      bottom: -9px;

      width: 100%;
      height: 2px;

      background: #111111;
    }



    /* =========================================
       PORTFOLIO SECTION
    ========================================= */

    .portfolio-section {
      width: 100%;

      max-width: 1400px;

      margin:
        0
        auto;

      padding:
        70px
        28px
        120px;
    }



    /* =========================================
       GRID
    ========================================= */

    .portfolio-grid {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap:
        50px
        28px;
    }



    /* =========================================
       ITEM
    ========================================= */

    .portfolio-item {
      width: 100%;

      min-width: 0;

      cursor: pointer;
    }

    .portfolio-item.hide {
      display: none;
    }



    /* =========================================
       THUMBNAIL
    ========================================= */

    .portfolio-thumb {
      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      overflow: hidden;

      background: #fafafa;
    }


    /*
      중요:
      이미지를 absolute로 배치해서
      placeholder 때문에 아래로 밀리지 않도록 수정
    */

    .portfolio-thumb img {
      position: absolute;

      inset: 0;

      z-index: 1;

      width: 100%;
      height: 100%;

      object-fit: contain;

      object-position: center;

      opacity: 0;

      transition:
        opacity 0.25s ease,
        transform 0.55s cubic-bezier(.2,.7,.2,1);
    }

    .portfolio-thumb img.loaded {
      opacity: 1;
    }

    .portfolio-item:hover
    .portfolio-thumb img.loaded {
      transform:
        scale(1.025);
    }



    /* =========================================
       PLACEHOLDER
    ========================================= */

    .placeholder {
      position: absolute;

      inset: 0;

      z-index: 0;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      background:
        #f5f5f5;

      color: #aaaaaa;

      font-size: 12px;

      line-height: 1.7;
    }



    /* =========================================
       HOVER OVERLAY
    ========================================= */

    .portfolio-overlay {
      position: absolute;

      inset: 0;

      z-index: 2;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      background:
        rgba(
          0,
          0,
          0,
          0.58
        );

      color: #ffffff;

      opacity: 0;

      transition:
        opacity
        0.3s ease;
    }

    .portfolio-item:hover
    .portfolio-overlay {
      opacity: 1;
    }

    .portfolio-overlay
    .category {
      margin-bottom: 11px;

      font-size: 10px;

      letter-spacing: 2px;

      opacity: 0.75;
    }

    .portfolio-overlay h3 {
      font-size: 18px;

      font-weight: 500;

      letter-spacing: -0.4px;
    }



    /* =========================================
       PORTFOLIO INFO
    ========================================= */

    .portfolio-info {
      padding-top: 17px;
    }

    .portfolio-info
    .category {
      margin-bottom: 7px;

      color: #a0a0a0;

      font-size: 11px;

      font-weight: 500;

      letter-spacing: 1.5px;
    }

    .portfolio-info h3 {
      font-size: 16px;

      font-weight: 600;

      line-height: 1.4;

      letter-spacing: -0.5px;
    }



    /* =========================================
       MODAL
    ========================================= */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      overflow-y: auto;

      padding:
        75px
        25px
        80px;

      background:
        rgba(
          0,
          0,
          0,
          0.93
        );
    }

    .modal.show {
      display: block;
    }

    .modal-inner {
      width: 100%;

      max-width: 1200px;

      margin:
        0
        auto;
    }



    /* =========================================
       MODAL CLOSE
    ========================================= */

    .modal-close {
      position: fixed;

      top: 25px;

      right: 30px;

      z-index: 10000;

      width: 48px;
      height: 48px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(
          255,
          255,
          255,
          0.14
        );

      color: #ffffff;

      font-size: 27px;

      line-height: 48px;

      cursor: pointer;

      transition:
        background
        0.2s ease;
    }

    .modal-close:hover {
      background:
        rgba(
          255,
          255,
          255,
          0.25
        );
    }



    /* =========================================
       MODAL TITLE
    ========================================= */

    .modal-title {
      margin-bottom: 40px;

      text-align: center;

      color: #ffffff;
    }

    .modal-title
    .category {
      margin-bottom: 10px;

      color: #aaaaaa;

      font-size: 11px;

      letter-spacing: 2px;
    }

    .modal-title h2 {
      font-size: 27px;

      font-weight: 500;
    }



    /* =========================================
       MODAL IMAGES
    ========================================= */

    .modal-images {
      display: flex;

      flex-direction: column;

      gap: 55px;
    }

    .modal-image-section {
      width: 100%;
    }

    .modal-label {
      margin-bottom: 12px;

      text-align: center;

      color: #cccccc;

      font-size: 10px;

      letter-spacing: 2px;
    }

    .modal-image-block {
      width: 100%;

      padding: 12px;

      background: #ffffff;
    }

    .modal-image-block img {
      width: 100%;

      height: auto;

      margin: auto;
    }

    .modal-image-section.mobile {
      max-width: 600px;

      margin:
        0
        auto;
    }



    /* =========================================
       FOOTER
    ========================================= */

    footer {
      padding:
        50px
        20px;

      border-top:
        1px solid #eeeeee;

      text-align: center;

      color: #999999;

      font-size: 11px;

      letter-spacing: 1px;
    }



    /* =========================================
       TABLET
    ========================================= */

    @media
    (max-width: 1000px) {

      .portfolio-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }



    /* =========================================
       MOBILE
    ========================================= */

    @media
    (max-width: 650px) {

      .portfolio-header {
        padding:
          65px
          20px
          45px;
      }

      .portfolio-header h1 {
        letter-spacing: -2px;
      }

      .filters {
        justify-content: flex-start;

        gap: 26px;

        padding:
          20px
          16px;
      }

      .portfolio-section {
        padding:
          50px
          16px
          80px;
      }

      .portfolio-grid {
        grid-template-columns:
          1fr;

        gap: 42px;
      }

      .portfolio-overlay {
        display: none;
      }

      .modal {
        padding:
          70px
          10px
          40px;
      }

      .modal-close {
        top: 14px;

        right: 14px;
      }

    }


  </style>

</head>



<body>

  ========================================== -->

  </main>



  <!-- =========================================
       MODAL
  ========================================== -->

  <div
    class="modal"
    id="portfolioModal"
  >

    <button
      class="modal-close"
      id="modalClose"
      type="button"
    >
      ×
    </button>


    <div class="modal-inner">

        >

      <div

      >

    </div>

  </div>



  <!-- =========================================
       FOOTER
  ========================================== -->

  <footer>
    © 2026 Hospital Marketing Portfolio
  </footer>

       JAVASCRIPT
  ========================================== -->

      {

      },

      {

        title: "Holiday Design 01",
        main: "images/holiday/holiday01.png"
      }


    ];



    /* =========================================
       CATEGORY NAME
    ========================================== */

    const categoryNames = {

      blog:
        "BLOG SKIN",

      event:
        "EVENT",

      posting:
        "POSTING",

      holiday:
        "HOLIDAY"

    };



    /* =========================================
       ELEMENTS
    ========================================== */

    const portfolioGrid =
      document.getElementById(
        "portfolioGrid"
      );

    const filterButtons =
      document.querySelectorAll(
        ".filter-btn"
      );

    const modal =
      document.getElementById(
        "portfolioModal"
      );

    const modalClose =
      document.getElementById(
        "modalClose"
      );

    const modalCategory =
      document.getElementById(
        "modalCategory"
      );

    const modalTitle =
      document.getElementById(
        "modalTitle"
      );

    const modalImages =
      document.getElementById(
        "modalImages"
      );



    /* =========================================
       CREATE PORTFOLIO
    ========================================== */

    function createPortfolioItems() {

      portfolioGrid.innerHTML = "";


      portfolioData.forEach(
        (
          item,
          index
        ) => {


          const article =
            document.createElement(
              "article"
            );


          article.className =
            "portfolio-item";


          article.dataset.category =
            item.category;


          article.dataset.index =
            index;



          const thumb =
            document.createElement(
              "div"
            );


          thumb.className =
            "portfolio-thumb";



          const placeholder =
            document.createElement(
              "div"
            );


          placeholder.className =
            "placeholder";


          placeholder.innerHTML =
            `${categoryNames[item.category]}<br>이미지를 불러오는 중입니다.`;



          const image =
            document.createElement(
              "img"
            );


          /*
            중요:
            onload / onerror를 먼저 등록하고
            src를 마지막에 설정
          */

          image.alt =
            item.title;


          image.loading =
            "lazy";


          image.decoding =
            "async";


          image.onload =
            function () {

              image.classList.add(
                "loaded"
              );

              placeholder.remove();

            };


          image.onerror =
            function () {

              image.remove();

              placeholder.innerHTML =
                `${categoryNames[item.category]}<br>이미지 파일을 확인해주세요.`;

            };


          image.src =
            item.main;



          /*
            캐시에 이미 저장된 이미지 대응
          */

          if (
            image.complete &&
            image.naturalWidth > 0
          ) {

            image.classList.add(
              "loaded"
            );

            placeholder.remove();

          }



          const overlay =
            document.createElement(
              "div"
            );


          overlay.className =
            "portfolio-overlay";


          overlay.innerHTML = `

            <div class="category">
              ${categoryNames[item.category]}
            </div>

            <h3>
              ${item.title}
            </h3>

          `;



          thumb.appendChild(
            placeholder
          );


          thumb.appendChild(
            image
          );


          thumb.appendChild(
            overlay
          );



          const info =
            document.createElement(
              "div"
            );


          info.className =
            "portfolio-info";


          info.innerHTML = `

            <div class="category">
              ${categoryNames[item.category]}
            </div>

            <h3>
              ${item.title}
            </h3>

          `;



          article.appendChild(
            thumb
          );


          article.appendChild(
            info
          );



          article.addEventListener(
            "click",
            function () {

              openModal(
                item
              );

            }
          );



          portfolioGrid.appendChild(
            article
          );


        }
      );


    }



    /* =========================================
       ITEMS
    ========================================== */

    function getPortfolioItems() {

      return document.querySelectorAll(
        ".portfolio-item"
      );

    }



    /* =========================================
       ALL
       모든 작업물 표시
    ========================================== */

    function showAllPreview() {

      const items =
        getPortfolioItems();


      items.forEach(
        item => {

          item.classList.remove(
            "hide"
          );

        }
      );

    }



    /* =========================================
       CATEGORY
    ========================================== */

    function showCategory(
      category
    ) {

      const items =
        getPortfolioItems();


      items.forEach(
        item => {


          if (
            item.dataset.category
            ===
            category
          ) {

            item.classList.remove(
              "hide"
            );

          }

          else {

            item.classList.add(
              "hide"
            );

          }


        }
      );

    }



    /* =========================================
       FILTER CLICK
    ========================================== */

    filterButtons.forEach(
      button => {


        button.addEventListener(
          "click",
          function () {


            filterButtons.forEach(
              btn =>

                btn.classList.remove(
                  "active"
                )

            );


            button.classList.add(
              "active"
            );


            const filter =
              button.dataset.filter;


            if (
              filter === "all"
            ) {

              showAllPreview();

            }

            else {

              showCategory(
                filter
              );

            }


          }
        );


      }
    );



    /* =========================================
       MODAL
    ========================================== */

    function openModal(
      item
    ) {


      modalCategory.textContent =
        categoryNames[
          item.category
        ];


      modalTitle.textContent =
        item.title;


      modalImages.innerHTML =
        "";



      /* MAIN IMAGE */

      if (
        item.main
      ) {


        const mainSection =
          document.createElement(
            "div"
          );


        mainSection.className =
          "modal-image-section";



        const mainLabel =
          document.createElement(
            "div"
          );


        mainLabel.className =
          "modal-label";


        mainLabel.textContent =
          item.category === "blog"
          ?
          "PC VERSION"
          :
          "DESIGN";



        const mainBox =
          document.createElement(
            "div"
          );


        mainBox.className =
          "modal-image-block";



        const mainImage =
          document.createElement(
            "img"
          );


        mainImage.src =
          item.main;


        mainImage.alt =
          item.title;



        mainBox.appendChild(
          mainImage
        );


        mainSection.appendChild(
          mainLabel
        );


        mainSection.appendChild(
          mainBox
        );


        modalImages.appendChild(
          mainSection
        );


      }



      /* MOBILE IMAGE */

      if (
        item.sub
      ) {


        const mobileSection =
          document.createElement(
            "div"
          );


        mobileSection.className =
          "modal-image-section mobile";



        const mobileLabel =
          document.createElement(
            "div"
          );


        mobileLabel.className =
          "modal-label";


        mobileLabel.textContent =
          "MOBILE VERSION";



        const mobileBox =
          document.createElement(
            "div"
          );


        mobileBox.className =
          "modal-image-block";



        const mobileImage =
          document.createElement(
            "img"
          );


        mobileImage.src =
          item.sub;


        mobileImage.alt =
          item.title;



        mobileBox.appendChild(
          mobileImage
        );


        mobileSection.appendChild(
          mobileLabel
        );


        mobileSection.appendChild(
          mobileBox
        );


        modalImages.appendChild(
          mobileSection
        );


      }



      modal.classList.add(
        "show"
      );


      document.body.style.overflow =
        "hidden";


    }



    /* =========================================
       CLOSE MODAL
    ========================================== */

    function closeModal() {

      modal.classList.remove(
        "show"
      );


      document.body.style.overflow =
        "";

    }



    modalClose.addEventListener(
      "click",
      closeModal
    );



    modal.addEventListener(
      "click",
      function (
        event
      ) {

        if (
          event.target
          ===
          modal
        ) {

          closeModal();

        }

      }
    );



    document.addEventListener(
      "keydown",
      function (
        event
      ) {

        if (
          event.key
          ===
          "Escape"
        ) {

          closeModal();

        }

      }
    );



    /* =========================================
       START
    ========================================== */

    createPortfolioItems();


    /*
      최초 접속 시
      모든 작업물 표시
    */

    showAllPreview();


  </script>


</body>

</html>
